---
name: Linux AppImage Production

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LEGAL'
      - 'LICENSE'
      - 'telegram-android/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LEGAL'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: write

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_TOKEN }}

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true


      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential git pkg-config \
            qt6-base-dev qt6-base-private-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-image-formats-plugins qt6-l10n-tools qt6-declarative-dev qt6-multimedia-dev qt6-shadertools-dev qt6-shader-baker \
            libqt6core5compat6-dev qt6-svg-dev qt6-wayland-dev qtwayland5 \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev \
            libjpeg-dev libavif-dev libwebp-dev libopus-dev libvpx-dev \
            libssl-dev libopenal-dev libpulse-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-record0-dev gobject-introspection libgirepository1.0-dev \
            libxcb-screensaver0-dev libxcb-util-dev libxcb-ewmh-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-x11-dev libxcb-shm0-dev \
            libxcomposite-dev libxdamage-dev libxrender-dev libxtst-dev libxss-dev libxcursor-dev \
            libasound2-dev libgbm-dev libdrm-dev libepoxy-dev libpipewire-0.3-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
            libglib2.0-dev libdbus-1-dev libx11-dev \
            libxrandr-dev libxi-dev libx11-xcb-dev libxcb-util-dev libxcb-cursor-dev libxcb-ewmh-dev \
            python3-dev python3-pip python3-setuptools gperf \
            yasm nasm ccache ninja-build fuse libopenh264-dev libboost-all-dev \
            cmake dh-make dpkg-dev mold liblz4-dev libxxhash-dev libpcsclite-dev libminizip-dev qt6-shader-baker libqt6shadertools6-dev clang llvm

      - name: Install Python dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade grpcio grpcio-tools cryptography pyyaml requests sqlalchemy protobuf
          echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-appimage-${{ github.sha }}
          restore-keys: |
            ccache-appimage-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache -z

      - name: Build Binary
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'Release' }}"
          export BUILD_TYPE
          export JOBS=$(nproc)
          export CCACHE_DIR=~/.ccache
          export TDESKTOP_API_ID="17349"
          export TDESKTOP_API_HASH="344583e45741c457fe1862106095a5eb"
          export CC=clang
          export CXX=clang++

          chmod +x build_linux.sh
          ./build_linux.sh

          ccache -s

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh
          ls -lh CRYPTOGRAM-Linux-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptogram-linux-appimage
          path: CRYPTOGRAM-Linux-x86_64.AppImage
          retention-days: 30
