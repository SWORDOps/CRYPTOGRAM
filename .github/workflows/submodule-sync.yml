---
name: Submodule Fork Sync

on:
  schedule:
    # Monday 6am UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-fork-sync:
    name: Check forked submodules against upstream
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare forked submodules with upstream
        id: compare
        run: |
          set -u

          # Each entry: "submodule_path|upstream_url"
          SUBMODULES=(
            "cmake|https://github.com/desktop-app/cmake_helpers.git"
            "Telegram/ThirdParty/libsignal|https://github.com/signalapp/libsignal-protocol-c.git"
          )

          report=""
          behind_count=0

          for entry in "${SUBMODULES[@]}"; do
            sub_path="${entry%%|*}"
            upstream_url="${entry##*|}"

            echo "::group::Checking $sub_path"
            echo "  Submodule path : $sub_path"
            echo "  Upstream URL    : $upstream_url"

            # Get the commit this repo pins for the submodule
            fork_sha=$(git ls-tree HEAD "$sub_path" --object-only 2>/dev/null | head -1)
            if [ -z "$fork_sha" ]; then
              echo "  WARNING: could not resolve pinned SHA for $sub_path — skipping"
              report="${report}- **${sub_path}**: could not resolve pinned SHA (skipped)\n"
              echo "::endgroup::"
              continue
            fi
            echo "  Fork pinned SHA : $fork_sha"

            # Clone upstream shallow to resolve the default branch HEAD
            tmp_dir=$(mktemp -d)
            git clone --depth 1 "$upstream_url" "$tmp_dir/upstream" 2>/dev/null
            upstream_sha=$(git -C "$tmp_dir/upstream" rev-parse HEAD 2>/dev/null)
            rm -rf "$tmp_dir"

            if [ -z "$upstream_sha" ]; then
              echo "  WARNING: could not clone upstream — skipping"
              report="${report}- **${sub_path}**: could not clone upstream (skipped)\n"
              echo "::endgroup::"
              continue
            fi
            echo "  Upstream HEAD   : $upstream_sha"

            if [ "$fork_sha" = "$upstream_sha" ]; then
              echo "  RESULT: up to date"
              report="${report}- **${sub_path}**: up to date (${fork_sha:0:12})\n"
            else
              echo "  RESULT: BEHIND upstream"
              behind_count=$((behind_count + 1))
              report="${report}- **${sub_path}**: BEHIND upstream (fork: ${fork_sha:0:12}, upstream: ${upstream_sha:0:12})\n"
            fi
            echo "::endgroup::"
          done

          echo "behind_count=$behind_count" >> "$GITHUB_OUTPUT"

          # Write report to a file for the issue body, preserving newlines
          printf '%b' "$report" > /tmp/submodule_report.md

          cat /tmp/submodule_report.md

      - name: Create or update issue if forks are behind
        if: steps.compare.outputs.behind_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/submodule_report.md', 'utf8');
            const date = new Date().toISOString().slice(0, 10);

            const title = 'Submodule fork sync: forks are behind upstream';
            const body = [
              '## Submodule Fork Sync Report',
              '',
              `**Date**: ${date}`,
              '',
              'One or more forked submodules are behind their upstream repositories.',
              'Review and merge upstream changes to reduce divergence risk.',
              '',
              report,
              '',
              '---',
              '_This issue was auto-generated by the `submodule-sync` workflow._',
            ].join('\n');

            // Search for an existing open issue with the same title
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'submodule-sync',
            });

            const existing = issues.data.find(i => i.title === title);

            if (existing) {
              // Update the existing issue with a fresh report comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `**Update ${date}**\n\n${report}`,
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['submodule-sync', 'maintenance'],
              });
              core.info('Created new submodule-sync issue');
            }

      - name: Summary
        if: always()
        run: |
          echo "## Submodule Fork Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Submodules behind upstream**: ${{ steps.compare.outputs.behind_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run date**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
