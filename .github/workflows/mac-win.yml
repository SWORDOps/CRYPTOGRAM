name: Mac and Windows Native

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  macOS:
    name: macOS Telegram Native
    runs-on: macos-14
    timeout-minutes: 360
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Free Disk Space (macOS)
        run: |
          # NOTE: Do NOT remove Xcode or CommandLineTools — brew and prepare.py need them.
          # Only remove simulators, caches, and unused platform toolchains.
          sudo rm -rf /Library/Developer/CoreSimulator/Caches
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/Homebrew
          rm -rf /opt/homebrew/share/man /opt/homebrew/share/doc /opt/homebrew/share/info
          df -h /


      - name: Install dependencies
        run: |
          brew install cmake ninja yasm pkg-config autoconf automake libtool meson nasm
          python3 -m pip install --upgrade --break-system-packages --ignore-installed pip
          brew cleanup -s || true

      - name: Run prepare.py to build dependencies
        run: |
          export QT=6.11.1
          python3 Telegram/build/prepare/prepare.py qt6

      - name: Configure CMake
        env:
          QT: '6.11.1'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/Libraries/local/Qt-6.11.1;$GITHUB_WORKSPACE/Libraries/local" \
            -DDESKTOP_APP_USE_PACKAGED=OFF \
            -DDESKTOP_APP_DISABLE_SWIFT6=ON \
            -DTG_OWT_PACKAGED_BUILD=OFF \
            -DTDESKTOP_API_ID=17349 \
            -DTDESKTOP_API_HASH=344583e45741c457fe1862106095a5eb
        
      - name: Build Telegram
        run: |
          cmake --build build --config Release --parallel 2

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptogram-macos
          path: build/Telegram/Telegram.app
          retention-days: 30

  Windows:
    name: Windows Telegram Native
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Free Disk Space (Windows)
        shell: powershell
        run: |
          # Remove large pre-installed tools to free disk space
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Haskell Platform" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\mysql" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\mingw64" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Strawberry" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\ProgramData\Package Cache" -ErrorAction SilentlyContinue
          Get-PSDrive C | Select-Object Used,Free


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Visual Studio Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run prepare.py to build dependencies
        shell: cmd
        run: |
          set QT=6.11.1
          set Platform=x64
          if exist Libraries\win64\libvpx rmdir /Q /S Libraries\win64\libvpx
          if exist Libraries\win64\cache_keys\libvpx del /F /Q Libraries\win64\cache_keys\libvpx
          python Telegram/build/prepare/prepare.py qt6

      - name: Configure CMake
        shell: cmd
        run: |
          set QT=6.11.1
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\Libraries\win64\Qt-6.11.1;%GITHUB_WORKSPACE%\Libraries\win64\local" -DDESKTOP_APP_USE_PACKAGED=OFF -DTG_OWT_PACKAGED_BUILD=OFF -DTDESKTOP_API_ID=17349 -DTDESKTOP_API_HASH=344583e45741c457fe1862106095a5eb

      - name: Build Telegram
        shell: cmd
        run: |
          cmake --build build --config Release --parallel 4

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptogram-windows
          path: build/Telegram/Telegram.exe
          retention-days: 30
